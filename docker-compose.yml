version: "3.9"

services:
  credit-risk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=mlruns
      - MLFLOW_MODEL_NAME=credit_risk_best_model
      - MODEL_STAGE=latest
    volumes:
      # Mount mlruns so the container always uses the latest registered model
      - ./mlruns:/app/mlruns:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s